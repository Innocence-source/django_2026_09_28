<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务清单</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
            padding: 50px 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* 扫描线背景 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(transparent 50%, rgba(0, 255, 255, 0.03) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1000;
        }

        /* 网格背景 */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            color: #00ffff;
            font-size: 3.5rem;
            margin-bottom: 50px;
            text-shadow:
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #0088ff;
            letter-spacing: 8px;
            font-weight: 900;
            text-transform: uppercase;
            animation: glitch 2s infinite;
        }

        @keyframes glitch {
            0%, 100% { text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff; }
            20% { text-shadow: -2px 0 #ff00ff, 2px 0 #00ffff; }
            40% { text-shadow: 2px 0 #ff00ff, -2px 0 #00ffff; }
            60% { text-shadow: -1px 0 #ff00ff, 1px 0 #00ffff; }
            80% { text-shadow: 1px 0 #ff00ff, -1px 0 #00ffff; }
        }

        /* 统计卡片区域 */
        .stats-container {
            display: flex;
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            flex: 1;
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1) 0%, rgba(255, 0, 255, 0.1) 100%);
            border: 2px solid #00ffff;
            border-radius: 0;
            padding: 10px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(0, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: scan 3s linear infinite;
        }

        @keyframes scan {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .stat-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow:
                0 0 20px #00ffff,
                0 0 40px rgba(0, 255, 255, 0.3),
                inset 0 0 20px rgba(0, 255, 255, 0.1);
            border-color: #ff00ff;
        }

        .stat-card .stat-icon {
            font-size: 2.2rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px #00ffff);
        }

        .stat-card .stat-number {
            font-size: 2.8rem;
            font-weight: 900;
            margin-bottom: 8px;
            text-shadow: 0 0 20px currentColor;
        }

        .stat-card .stat-label {
            font-size: 0.75rem;
            color: #00ffff;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .stat-card.total {
            border-color: #00ffff;
        }

        .stat-card.total .stat-number {
            color: #00ffff;
        }

        .stat-card.completed {
            border-color: #ff00ff;
        }

        .stat-card.completed .stat-number {
            color: #ff00ff;
        }

        .stat-card.pending {
            border-color: #ffff00;
        }

        .stat-card.pending .stat-number {
            color: #ffff00;
        }

        /* 添加任务区域 */
        .add-task-section {
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.95) 0%, rgba(20, 10, 30, 0.95) 100%);
            border: 2px solid #ff00ff;
            border-radius: 0;
            padding: 30px;
            position: relative;
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        .add-task-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, #ff00ff, #00ffff, #ff00ff);
            animation: borderGlow 2s linear infinite;
        }

        @keyframes borderGlow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .add-task-section h2 {
            font-size: 1.4rem;
            color: #ff00ff;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px #ff00ff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .add-task-section h2::before {
            content: '⚡';
            filter: drop-shadow(0 0 10px #ffff00);
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #00ffff;
            margin-bottom: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid #333;
            border-radius: 0;
            font-size: 0.9rem;
            font-family: 'Orbitron', monospace;
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.8);
            color: #00ffff;
            letter-spacing: 1px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow:
                0 0 10px #00ffff,
                0 0 20px rgba(0, 255, 255, 0.3),
                inset 0 0 10px rgba(0, 255, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #555;
            font-style: italic;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn-add {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff00ff 0%, #8800ff 100%);
            color: white;
            border: 2px solid #ff00ff;
            border-radius: 0;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-family: 'Orbitron', monospace;
            position: relative;
            overflow: hidden;
            clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
        }

        .btn-add::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
        }

        .btn-add:hover {
            transform: translateY(-3px);
            box-shadow:
                0 0 20px #ff00ff,
                0 0 40px rgba(255, 0, 255, 0.4);
            text-shadow: 0 0 10px #fff;
        }

        .btn-add:hover::before {
            left: 100%;
        }

        .btn-add:active {
            transform: translateY(0);
        }

        /* 任务列表区域 */
        .task-list-section {
            margin: 60px 0 0;
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.95) 0%, rgba(20, 10, 30, 0.95) 100%);
            border: 2px solid #00ffff;
            border-radius: 0;
            padding: 20px;
            position: relative;
            clip-path: polygon(0 15px, 15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }

        .task-list-section h2 {
            font-size: 1.4rem;
            color: #00ffff;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 10px #00ffff;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .task-list-section h2::before {
            content: '🔮';
            filter: drop-shadow(0 0 10px #ff00ff);
        }

        .task-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            text-align: center;
        }

        .task-table thead th {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.2) 0%, rgba(255, 0, 255, 0.2) 100%);
            color: #00ffff;
            padding: 16px 20px;
            text-align: center;
            font-weight: 800;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .task-table thead th:first-child {
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%);
        }

        .task-table thead th:last-child {
            clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .task-table  tr {
            background: rgba(0, 0, 0, 0.6);
            transition: all 0.3s ease;
            border: 1px solid #222;
            position: relative;
            margin-bottom: 8px;
        }

        .task-table  tr::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 3px;
            height: 100%;
            background: #ff00ff;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .task-table  tr:hover {
            background: rgba(0, 255, 255, 0.05);
            box-shadow:
                0 0 20px rgba(0, 255, 255, 0.2),
                inset 0 0 30px rgba(0, 255, 255, 0.05);
            transform: translateX(10px);
            border-color: #00ffff;
        }

        .task-table  tr:hover::before {
            opacity: 1;
        }

        .task-table  td {
            padding: 18px 20px;
            vertical-align: middle;
        }

        .task-table tbody td:first-child {
            clip-path: polygon(10px 0, 100% 0, 100% 100%, 0 100%);
        }

        .task-table tbody td:last-child {
            clip-path: polygon(0 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        /* 自定义复选框样式 */
        .task-table tbody td:first-child {
            width: 70px;
            text-align: center;
        }

        .custom-checkbox {
            position: relative;
            display: inline-block;
            width: 26px;
            height: 26px;
        }

        .custom-checkbox input[type="checkbox"] {
            opacity: 0;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            cursor: pointer;
            z-index: 2;
        }

        .custom-checkbox .checkmark {
            position: absolute;
            top: 0;
            left: 0;
            width: 26px;
            height: 26px;
            background: transparent;
            border: 2px solid #555;
            transition: all 0.3s ease;
            clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark {
            background: linear-gradient(135deg, #ff00ff 0%, #8800ff 100%);
            border-color: #ff00ff;
            box-shadow:
                0 0 10px #ff00ff,
                0 0 20px rgba(255, 0, 255, 0.4);
        }

        .custom-checkbox input[type="checkbox"]:checked + .checkmark::after {
            content: '✓';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 0 5px #fff;
        }

        .custom-checkbox input[type="checkbox"]:disabled + .checkmark {
            background: rgba(255, 0, 255, 0.3);
            border-color: #ff00ff;
            opacity: 0.5;
        }

        .custom-checkbox input[type="checkbox"]:disabled + .checkmark::after {
            content: '✓';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: #ff00ff;
            font-size: 16px;
            font-weight: bold;
        }

        .task-id {
            font-family: 'Orbitron', monospace;
            font-weight: 800;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.15);
            padding: 6px 12px;
            border: 1px solid #00ffff;
            font-size: 0.8rem;
            text-shadow: 0 0 5px #00ffff;
            clip-path: polygon(4px 0, 100% 0, calc(100% - 4px) 100%, 0 100%);
        }

        .task-name {
            font-weight: 700;
            color: #fff;
            font-size: 1.05rem;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* 编辑输入框美化 */
        .edit-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .edit-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ff00ff;
            border-radius: 0;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ff00ff;
            background: rgba(255, 0, 255, 0.1);
            font-family: 'Orbitron', monospace;
            box-shadow:
                0 0 10px #ff00ff,
                0 0 20px rgba(255, 0, 255, 0.3),
                inset 0 0 10px rgba(255, 0, 255, 0.1);
            transition: all 0.3s ease;
            animation: editPulse 1s ease-in-out infinite;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }

        .edit-input:focus {
            outline: none;
            border-color: #00ffff;
            color: #00ffff;
            background: rgba(0, 255, 255, 0.1);
            box-shadow:
                0 0 15px #00ffff,
                0 0 30px rgba(0, 255, 255, 0.4),
                inset 0 0 15px rgba(0, 255, 255, 0.1);
            animation: none;
        }

        .edit-input::placeholder {
            color: #666;
            font-style: italic;
        }

        @keyframes editPulse {
            0%, 100% {
                box-shadow:
                    0 0 10px #ff00ff,
                    0 0 20px rgba(255, 0, 255, 0.3),
                    inset 0 0 10px rgba(255, 0, 255, 0.1);
            }
            50% {
                box-shadow:
                    0 0 20px #ff00ff,
                    0 0 40px rgba(255, 0, 255, 0.4),
                    inset 0 0 20px rgba(255, 0, 255, 0.2);
            }
        }

        .edit-hint {
            position: absolute;
            bottom: -20px;
            left: 0;
            font-size: 0.6rem;
            color: #00ffff;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 5px #00ffff;
        }

        .task-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 0;
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
        }

        .task-status.completed {
            background: linear-gradient(135deg, rgba(255, 0, 255, 0.3) 0%, rgba(136, 0, 255, 0.3) 100%);
            color: #ff00ff;
            border: 1px solid #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .task-status.completed::before {
            content: '◆';
            font-weight: bold;
            filter: drop-shadow(0 0 5px #ff00ff);
        }

        .task-status.pending {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.3) 0%, rgba(0, 136, 255, 0.3) 100%);
            color: #00ffff;
            border: 1px solid #00ffff;
            text-shadow: 0 0 10px #00ffff;
        }

        .task-status.pending::before {
            content: '◈';
            filter: drop-shadow(0 0 5px #00ffff);
        }

        .task-status.in-progress {
            background: linear-gradient(135deg, rgba(255, 255, 0, 0.3) 0%, rgba(255, 136, 0, 0.3) 100%);
            color: #ffff00;
            border: 1px solid #ffff00;
            text-shadow: 0 0 10px #ffff00;
        }

        .task-status.in-progress::before {
            content: '◉';
            filter: drop-shadow(0 0 5px #ffff00);
        }

        .task-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 10px 18px;
            border: 2px solid;
            border-radius: 0;
            font-size: 0.7rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Orbitron', monospace;
            position: relative;
            overflow: hidden;
            clip-path: polygon(6px 0, 100% 0, calc(100% - 6px) 100%, 0 100%);
            white-space: nowrap;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.4s ease;
        }

        .btn-edit {
            background: linear-gradient(135deg, #0088ff 0%, #0044ff 100%);
            color: #fff;
            border-color: #00ffff;
        }

        .btn-edit:hover {
            box-shadow:
                0 0 15px #00ffff,
                0 0 30px rgba(0, 255, 255, 0.4);
            text-shadow: 0 0 10px #fff;
            transform: translateY(-3px);
        }

        .btn-edit:hover::before {
            left: 100%;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ff0044 0%, #cc0033 100%);
            color: #fff;
            border-color: #ff00ff;
        }

        .btn-delete:hover {
            box-shadow:
                0 0 15px #ff00ff,
                0 0 30px rgba(255, 0, 255, 0.4);
            text-shadow: 0 0 10px #fff;
            transform: translateY(-3px);
        }

        .btn-delete:hover::before {
            left: 100%;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 100px 20px;
            color: #555;
        }

        .empty-state .empty-icon {
            font-size: 6rem;
            margin-bottom: 30px;
            opacity: 0.5;
            filter: drop-shadow(0 0 20px #ff00ff);
        }

        .empty-state p {
            font-size: 1.3rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* 主布局 - 左右分栏 */
        .main-layout {
            display: flex;
            gap: 30px;
            align-items: flex-start;
        }

        .left-panel {
            flex: 0 0 340px;
            position: sticky;
            top: 30px;
        }

        .right-panel {
            flex: 1;
            min-width: 0;
        }

        /* 左侧面板标题 */
        .left-panel h1 {
            font-size: 1.6rem;
            margin-bottom: 22px;
            text-align: left;
            letter-spacing: 2px;
        }

        /* 统计卡片 - 纵向排列 */
        .stats-container {
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }

        .stat-card .stat-number {
            font-size: 2.5rem;
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .left-panel {
                flex: 0 0 320px;
            }
        }

        @media (max-width: 1024px) {
            .main-layout {
                flex-direction: column;
            }

            .left-panel {
                flex: none;
                width: 100%;
                position: static;
            }

            .left-panel h1 {
                text-align: center;
                font-size: 2rem;
            }

            .stats-container {
                flex-direction: row;
            }

            .stat-card {
                clip-path: none;
            }

            h1 {
                font-size: 2.5rem;
                letter-spacing: 4px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.8rem;
                letter-spacing: 2px;
            }

            .stats-container {
                flex-direction: column;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .task-table {
                display: block;
                overflow-x: auto;
            }

            .task-actions {
                flex-direction: column;
                gap: 10px;
            }

            .btn {
                justify-content: center;
                clip-path: none;
            }

            .add-task-section,
            .task-list-section {
                clip-path: none;
            }

            .task-id,
            .task-status {
                clip-path: none;
            }

            .custom-checkbox .checkmark {
                clip-path: none;
            }

            .edit-input {
                clip-path: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-layout">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <h1>📝 每日任务清单</h1>
                 <!-- 添加任务 -->
                 <div class="add-task-section">
                    <h2>添加新任务</h2>
                    <div class="form-group">
                        <label for="task-name">任务名称</label>
                        <input type="text" id="task-name" v-model.trim="taskName" placeholder="请输入任务名称...">
                    </div>
                    <button type="submit" class="btn-add" @click="taskAddHanlder">
                        <span>⚡</span> 添加任务
                    </button>
                </div>
                <!-- 任务统计 -->
                <div class="stats-container">
                    <div class="stat-card total">
                        <div class="stat-icon">📊</div>
                        <div class="stat-number">${ taskList.length }</div>
                        <div class="stat-label">全部任务</div>
                    </div>
                    <div class="stat-card completed">
                        <div class="stat-icon">✅</div>
                        <div class="stat-number">${doneCount}</div>
                        <div class="stat-label">已完成</div>
                    </div>
                    <div class="stat-card pending">
                        <div class="stat-icon">⏳</div>
                        <div class="stat-number">${pendingCount}</div>
                        <div class="stat-label">进行中</div>
                    </div>
                </div>

               
            </div>

            <!-- 右侧面板 -->
            <div class="right-panel">
                <!-- 任务列表 -->
                <div class="task-list-section">
                    <h2>任务列表</h2>
                    <table class="task-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>任务 ID</th>
                                <th>任务名称</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr v-for="item, index in taskList" :key="item.id">
                                <!-- {{ item.id }} 双大括号 在 django 模板中 代表 从服务端取值，和 vue 冲突了   -->
                                <td>
                                    <label class="custom-checkbox">
                                        <input type="checkbox" :checked="item.state == 1" :disabled="item.state == 1" @change="doneTaskHandler(item.id)">
                                        <span class="checkmark"></span>
                                    </label>
                                </td>
                                <td><span class="task-id">#${ item.id }</span></td>
                                <td class="task-name">
                                    <template v-if="editIndex === index">
                                        <div class="edit-input-wrapper">
                                            <input type="text" class="edit-input"
                                                @keydown.esc="editIndex = -1"
                                                @keydown.enter="modifyTaskHander(item.id, $event.target.value)"
                                                :value="item.name"
                                                placeholder="输入新任务名称...">
                                            <span class="edit-hint">按 Enter 确认，Esc 取消</span>
                                        </div>
                                    </template>
                                    <template v-else>
                                        ${item.name}
                                    </template>
                                </td>
                                <td>
                                    <span class="task-status " :class="{completed: item.state, 'in-progress': !item.state}">${ item.state ? '已完成': '进行中' }</span>
                                </td>
                                <td>
                                    <div class="task-actions">
                                        <button class="btn btn-edit" @click="editIndex = index">✏️ 修改</button>
                                        <button class="btn btn-delete" @click="deleteHandler(item.id, index)">🗑️ 移除</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>

<link rel="stylesheet" href="/static/layer/theme/default/layer.css">
<script src="/static/js/jquery-3.7.1.min.js"></script>
<script src="/static/layer/layer.js"></script>
<script src="/static/js/axios.min.js"></script>
<script src="/static/js/vue.global.js"></script>
<script src="/static/js/API.js"></script>

<script>

Vue.createApp({
    data() {

        return {
            taskName: "" ,
            taskList: [],  // 存放当前要展示的数据
            editIndex: -1, // 要修改的任务 对应的索引行
        }
    },
    delimiters: ["${",  "}"],  // 设置 插值的前缀 和 后缀 、解决和 django 冲突问题 
    methods: {
        taskAddHanlder(event) {
            if (this.taskName === "") {
                layer.msg("任务名不允许为空");
                return ;
            }
            // 发起 异步请求 
            API.addTask(this.taskName).then(response => {
                // 如果 成功、则 将 服务器返回的数据 添加到 taskList 中 
                this.taskList.push(response.data) ;
                this.taskName = "" ;
            }).catch(error => {
                layer.msg(error.response.data.message) ;
            })
        },
        queryTaskList() {
            API.findTaskList().then(response => {
                this.taskList = response.data ; 
            })
        },
        deleteHandler(taskId, tindex) {
            // 进行 友好提示
            layer.confirm("您确定要删除该任务吗?", (index) => {
                // 调用 接口 、完成 对该任务 的删除 
                API.deleteTaskById(taskId).then(response=> {
                    // 后端成功删除数据、 前台 将这条数据移除
                    this.taskList.splice(tindex, 1) ; 
                    // 关闭 友好提示窗口 
                    layer.close(index) ;
                })
            })
        },

        doneTaskHandler(taskId) {
            // 调用接口 、将 当前任务的状态更改为 已完成 
            API.doneTask(taskId).then(response=> {
                // 将当前任务的 状态 设置为 已完成 
                let task = this.taskList.find(t => t.id === taskId);
                task.state = 1 ;
            })
        },

        modifyTaskHander(taskId, taskName) {
            // 调用接口、完成任务名的修改 
            API.modifyTaskName({id: taskId, name: taskName}).then(response=> {
                // 如果成功、 则 获取 当前对应的任务 
                let task = this.taskList.find(t => t.id === taskId);
                task.name = taskName ;
                // 关闭 修改效果 
                this.editIndex = -1 ;
            }).catch(error=> {
                layer.msg(error.response.data.message);
            })
        }
    },
    created() {
        // 进页面查询所有的任务 
        this.queryTaskList() ;
    },
    computed: {
        doneCount(){
            return this.taskList.filter(t => t.state).length ;
        },
        pendingCount() {
            return this.taskList.filter(t => !t.state).length ;
        }
    }

}).mount(".container")


</script>

</html>
